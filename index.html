        const u = db.users.find((x) => x.username.toLowerCase() === uname.trim().toLowerCase());
        setUname('');

        if (invites.some((i) => i.status === 'PENDING' && ((i.fromId === me && i.toId === u.id) || (i.fromId === u.id && i.toId === me)))) return notify('An invitation between you two is already pending.');

        updateDB((d) => ({ ...d, invites: [...(d.invites || []), { id: rid('INV-'), fromId: me, toId: u.id, mode, status: 'PENDING', at: new Date().toISOString() }], notifications: [...(d.notifications || []), notifTo(u.id, '💌 Private chat invitation', currentUser.displayName + ' invited you to a ' + (mode === 'SECRET' ? 'secret (masked, burnable)' : 'private') + ' chat. Open Private Chats to accept, decline or block.')] }));

          const room = rid('SEC-');
          updateDB((d) => ({ ...d, invites: mark(d), secretRooms: { ...d.secretRooms, [room]: { id: room, participants: [inv.fromId, me], aliases: { [inv.fromId]: nm(inv.fromId), [me]: currentUser.displayName }, active: true, private: true, messages: [{ id: 'sys-init', senderId: 'SYSTEM', alias: 'Zero-Trace Guard', text: '🔒 Invite-only secret room. You both agreed to chat. Photos, voice notes & view-once media are available; "Burn Secret Room" wipes everything.', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }] } }, notifications: [...(d.notifications || []), notifTo(inv.fromId, '🔒 Secret chat accepted', currentUser.displayName + ' accepted. Open Secret Chat.')] }));

        } else {

          notify(`⏳ Too many attempts. Try again in ${Math.ceil((loginLockUntil - Date.now()) / 1000)}s.`);
          return;
        }
        const uClean = usernameInput.trim().toLowerCase();
        const found = db.users.find(
          (u) => u.username.toLowerCase() === uClean && checkPw(u, passwordInput)
        );
        if (!found) {
          loginFails++;
          if (loginFails >= 5) { loginLockUntil = Date.now() + 60000; loginFails = 0; }
          notify('❌ Invalid username or password.');
          return;
        }
        loginFails = 0;
        if (found.status === 'SUSPENDED') {
          notify('🚫 This account has been suspended by the Master Administrator.');
          return;
        }
        sessionStorage.setItem('nocturne_active_uid', found.id);

      const handleQuickSwitchAccount = (userId, targetNav) => {

      const handleLogout = () => {

      const handleRegisterAccount = (e) => {
        e.preventDefault();

        if (!regConfirm18) {

        if (regPassword.length < 8) {

        const cleanU = regUsername.trim().toLowerCase();
        if (!cleanU || !regPassword || !regDisplayName.trim()) {
          notify('❌ Please complete all required fields.');
          return;

      const startVoiceRecording = async (contextType) => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          audioChunksRef.current = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              dispatchMediaMessage(contextType, { audio: reader.result });
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach((t) => t.stop());
          };
          mediaRecorderRef.current = recorder;
          recorder.start();
          setIsRecording(true);
          setRecordingTarget(contextType);
        } catch (err) {
          // If user has no microphone attached or blocks mic permission, send a real playable synthetic voice note so testing never fails

      // Instant Match Generator so owner can test Secret Chat immediately without needing 2 tabs

      // (old demo partner generator kept but no longer used — Secret Chat now connects REAL users only)

                {/* REAL-TIME ENCRYPTED ROOM MESSENGER */}
                <div className="p-4 flex flex-col justify-between h-[460px] bg-slate-950">
                  <div className="border-b border-slate-800 pb-2.5">

                  <div className="flex-1 overflow-y-auto py-3 space-y-2.5">
                    {(db.privateRoomMessages[activeRoom.roomId] || []).map((m) => (
                      <div
                        key={m.id}
                        className={`p-3 rounded-2xl text-xs space-y-1.5 ${
                          m.senderId === currentUser.id
                            ? 'bg-rose-600 text-white ml-6'

                    {isRecording && recordingTarget === 'PRIVATE' ? (

                      <button
                        type="button"
                        onClick={() => startVoiceRecording('PRIVATE')}

          {/* MOBILE BOTTOM NAVIGATION */}

            <button

              <span>Private{inviteCount > 0 ? ' (' + inviteCount + ')' : ''}</span>

            <button
              onClick={() => setActiveNav('NOTIFS')}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<div id="nc-lockmsg">🔒 Session locked for your privacy.<br/>Reload the page to sign in again.</div>
  <script>
    // PRIVACY SHIELD: blur on focus loss, idle auto-lock (10 min), panic exit (button or Esc x3)
    (function () {
      var root = document.getElementById('root');
      var shield = function (on) { root.classList.toggle('nc-shield', on); };
      document.addEventListener('visibilitychange', function () { shield(document.hidden); });
      window.addEventListener('blur', function () { shield(true); });
      window.addEventListener('focus', function () { shield(false); });
      function lock() {
        try { sessionStorage.clear(); } catch (e) {}
        document.getElementById('nc-lockmsg').style.display = 'flex';
        root.innerHTML = '';
      }
      var idle; function arm() { clearTimeout(idle); idle = setTimeout(lock, 10 * 60 * 1000); }
      ['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(function (ev) { window.addEventListener(ev, arm, { passive: true }); });
      arm();
      function panic() { try { sessionStorage.clear(); } catch (e) {} location.replace('https://www.google.com'); }
      var b = document.createElement('button'); b.id = 'nc-panic'; b.textContent = '⚠ Panic exit'; b.onclick = panic; b.title = 'Instantly sign out and leave (or press Esc 3 times)';
      document.body.appendChild(b);
      var presses = [];
      window.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        var t = Date.now(); presses = presses.filter(function (x) { return t - x < 1200; }); presses.push(t);
        if (presses.length >= 3) panic();
      });
    })();
  </script>
